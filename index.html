<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Educacional</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="browser">

    <header class="top">
      <div class="windowbar">
        <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <span>PLATAFORMA EDUCACIONAL • MODO AVALIAÇÃO</span><span>🔒 Ambiente controlado</span>
      </div>
      <div class="tabs">

        <button class="tab active" data-page="material">📚 <span class="label">Material</span><span class="close">×</span></button>

        <button class="tab" data-page="atividade">📝 <span class="label">Atividade</span><span class="close">×</span></button>

        <button class="tab" data-page="recursos">🔧 <span class="label">Recursos</span><span class="close">×</span></button>

        <button class="tab-add" title="Abertura de novas guias desabilitada">＋</button>
      </div>

    </header>

    <div class="navbar">
      <button class="navbtn" id="back" title="Voltar">←</button>
      <button class="navbtn" id="forward" title="Avançar">→</button>
      <button class="navbtn" id="reload" title="Recarregar">↻</button>
      <div class="address"><span class="lock">🔒</span><span>plataforma.educacional.local</span></div>
      <span class="status">Modo quiosque</span>
    </div>

    <main class="content" id="content"></main>
    <div id="toast"></div>
  </div>

  <script src="main.js"></script>


</body>

</html>
