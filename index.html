<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Educacional</title>
<style>
*{box-sizing:border-box}
:root{--bg:#eef1f5;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#d8dee8;--accent:#2563eb;--accent2:#eff6ff;--danger:#dc2626}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.browser{height:100vh;display:flex;flex-direction:column}
.top{background:#20252d;color:#fff;padding:10px 14px 0}
.windowbar{height:28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#cbd5e1}
.dots{display:flex;gap:7px}.dot{width:11px;height:11px;border-radius:50%;background:#64748b}
.tabs{display:flex;align-items:end;gap:4px;height:48px}
.tab{height:38px;min-width:180px;max-width:250px;background:#343a44;border-radius:9px 9px 0 0;padding:0 13px;display:flex;align-items:center;gap:9px;cursor:pointer;border:0;color:#dbe3ef;font-size:14px}
.tab.active{background:#fff;color:#172033}.tab .close{margin-left:auto;font-size:17px;opacity:.6}
.tab-add{height:38px;width:40px;border:0;background:transparent;color:#fff;font-size:23px;cursor:not-allowed;opacity:.35}
.navbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 14px}
.navbtn{border:0;background:#f3f4f6;width:34px;height:34px;border-radius:8px;font-size:18px;color:#475569}
.address{flex:1;height:36px;border:1px solid var(--line);border-radius:18px;background:#f8fafc;display:flex;align-items:center;padding:0 14px;gap:9px;color:#64748b;font-size:14px}
.lock{color:#16a34a}.status{font-size:12px;color:#64748b;padding:0 5px}
.content{flex:1;overflow:auto;padding:26px}
.page{max-width:1100px;margin:auto}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:18px;padding:28px 30px;box-shadow:0 8px 25px #0001}
.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 10px #00000008}
.card h3{margin:0 0 8px}.card p{color:var(--muted);line-height:1.5}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}
button.secondary{background:#f3f4f6;color:#374151;border:1px solid var(--line);border-radius:9px;padding:10px 15px;cursor:pointer}
.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
.section h2{margin-top:0}.question{padding:18px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.option{display:block;padding:9px 0}.option input{margin-right:9px}
.notice{background:var(--accent2);border-left:4px solid var(--accent);padding:13px;border-radius:7px;margin:15px 0}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin:7px 0 12px}
#toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 16px;border-radius:9px;display:none;z-index:99}
footer{font-size:12px;color:#64748b;text-align:center;padding:15px}
@media(max-width:800px){.grid,.tools{grid-template-columns:1fr}.tab{min-width:0;flex:1}.tab span.label{display:none}.content{padding:15px}}
</style>
</head>
<body>
<div class="browser">
<header class="top">
  <div class="windowbar"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><span>PLATAFORMA EDUCACIONAL • MODO AVALIAÇÃO</span><span>🔒 Ambiente controlado</span></div>
  <div class="tabs">
    <button class="tab active" data-page="material">📚 <span class="label">Material</span><span class="close">×</span></button>
    <button class="tab" data-page="atividade">📝 <span class="label">Atividade</span><span class="close">×</span></button>
    <button class="tab" data-page="recursos">🔧 <span class="label">Recursos</span><span class="close">×</span></button>
    <button class="tab-add" title="Abertura de novas guias desabilitada">＋</button>
  </div>
</header>

<div class="navbar">
  <button class="navbtn" id="back" title="Voltar">←</button>
  <button class="navbtn" id="forward" title="Avançar">→</button>
  <button class="navbtn" id="reload" title="Recarregar">↻</button>
  <div class="address"><span class="lock">🔒</span><span>plataforma.educacional.local</span></div>
  <span class="status">Modo quiosque</span>
</div>

<main class="content" id="content"></main>
<div id="toast"></div>
</div>

<script>
const pages={
material:`
<div class="page">
 <div class="hero"><h1>📚 Material de Estudo</h1><p>Bem-vindo à plataforma. Consulte somente os materiais disponibilizados pelo professor.</p></div>
 <div class="grid">
  <div class="card"><h3>📘 Conceitos principais</h3><p>Espaço destinado ao texto, conceitos e explicações da aula.</p><button class="primary" onclick="showText()">Abrir conteúdo</button></div>
  <div class="card"><h3>🎬 Vídeo da aula</h3><p>Área reservada para um vídeo selecionado pelo professor.</p><button class="secondary" onclick="toast('Vídeo ainda não configurado.')">Assistir</button></div>
  <div class="card"><h3>📄 Documento</h3><p>Área para apostilas, roteiros ou outros documentos da atividade.</p><button class="secondary" onclick="toast('Documento ainda não configurado.')">Abrir documento</button></div>
 </div>
 <div id="textArea"></div>
 <footer>Material disponibilizado pelo professor • Plataforma Educacional v1.0</footer>
</div>`,
atividade:`
<div class="page">
 <div class="hero"><h1>📝 Atividade</h1><p>Responda às questões abaixo. Suas respostas ficam armazenadas nesta sessão.</p></div>
 <div class="section">
  <div class="notice">Leia cada questão com atenção. Ao finalizar, clique em <b>Finalizar atividade</b>.</div>
  <div class="question"><b>1. Qual é a função principal desta plataforma?</b>
   <label class="option"><input type="radio" name="q1" value="a"> Permitir acesso irrestrito à internet</label>
   <label class="option"><input type="radio" name="q1" value="b"> Organizar materiais e atividades em um ambiente controlado</label>
   <label class="option"><input type="radio" name="q1" value="c"> Substituir o professor</label>
  </div>
  <div class="question"><b>2. Quantas guias estão disponíveis?</b>
   <label class="option"><input type="radio" name="q2" value="a"> Uma</label>
   <label class="option"><input type="radio" name="q2" value="b"> Três</label>
   <label class="option"><input type="radio" name="q2" value="c"> Quantas o estudante quiser</label>
  </div>
  <div class="question"><b>3. Escreva uma observação sobre a atividade:</b><input type="text" id="q3" placeholder="Digite sua resposta"></div>
  <button class="primary" onclick="finish()">Finalizar atividade</button>
  <button class="secondary" onclick="saveAnswers()">Salvar respostas</button>
 </div>
 <footer>As questões podem ser substituídas pelo conteúdo da sua aula.</footer>
</div>`,
recursos:`
<div class="page">
 <div class="hero"><h1>🔧 Recursos</h1><p>Ferramentas disponibilizadas para a realização da atividade.</p></div>
 <div class="tools">
  <div class="section"><h2>🧮 Calculadora</h2><input type="number" id="n1" placeholder="Número 1"><input type="number" id="n2" placeholder="Número 2"><button class="primary" onclick="calc()">Somar</button><p id="result"></p></div>
  <div class="section"><h2>📋 Anotações</h2><input type="text" id="note" placeholder="Digite uma anotação"><button class="primary" onclick="saveNote()">Salvar anotação</button><p id="noteStatus"></p></div>
 </div>
 <div class="section"><h2>🌐 Recursos externos</h2><div class="notice">Nesta primeira versão, os recursos externos devem ser cadastrados pelo professor. Não há campo para digitar endereços de sites.</div></div>
 <footer>Somente ferramentas autorizadas pelo professor devem ser adicionadas.</footer>
</div>`
};

let current='material';
let historyStack=['material'], historyPos=0;
function render(page, push=true){
 current=page;
 document.getElementById('content').innerHTML=pages[page];
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));
 if(push){historyStack=historyStack.slice(0,historyPos+1);historyStack.push(page);historyPos++;}
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>render(t.dataset.page)));
document.getElementById('back').onclick=()=>{if(historyPos>0){historyPos--;render(historyStack[historyPos],false)}};
document.getElementById('forward').onclick=()=>{if(historyPos<historyStack.length-1){historyPos++;render(historyStack[historyPos],false)}};
document.getElementById('reload').onclick=()=>render(current,false);

function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function showText(){document.getElementById('textArea').innerHTML='<div class="section"><h2>Conteúdo</h2><p>Este espaço pode receber o conteúdo da sua sequência didática, textos, imagens e instruções para os estudantes.</p><p><b>Dica:</b> substitua este conteúdo pelo material real da aula.</p></div>'}
function saveAnswers(){localStorage.setItem('atividade_q3',document.getElementById('q3')?.value||'');toast('Respostas salvas nesta sessão.')}
function finish(){saveAnswers();toast('Atividade finalizada nesta sessão.')}
function calc(){const a=Number(document.getElementById('n1').value),b=Number(document.getElementById('n2').value);document.getElementById('result').textContent=`Resultado: ${a+b}`}
function saveNote(){localStorage.setItem('note',document.getElementById('note').value);document.getElementById('noteStatus').textContent='Anotação salva.'}

// Bloqueios de interface: atalhos comuns de abertura/navegação são interceptados.
// O bloqueio real do sistema deve ser feito pelo navegador/ambiente Linux em modo quiosque.
document.addEventListener('keydown',e=>{
 const blocked=(e.ctrlKey && ['l','t','n','w','r','u','s','o'].includes(e.key.toLowerCase())) ||
               (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) ||
               e.key==='F11';
 if(blocked){e.preventDefault();e.stopPropagation();toast('Ação bloqueada no ambiente educacional.')}
});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue='';});
render('material',false);
</script>
</body>
</html>
